<style>
:root{color-scheme:light}
:root{--bg:#f4f8f7;--cr-ink:#0f2a2d;--cr-mut:#4a6a6d;--cr-line:rgba(15,42,45,.16);--cr-chip:rgba(15,42,45,.06);--cr-on:#0f2a2d;--cr-onink:#fff;--cr-ring:#f4f8f7;--a:.14}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#05161B;--cr-ink:#eaf6f4;--cr-mut:rgba(232,244,243,.68);--cr-line:rgba(255,255,255,.22);--cr-chip:rgba(255,255,255,.07);--cr-on:#2dd4bf;--cr-onink:#05161B;--cr-ring:#05161B;--a:.16;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#05161B;--cr-ink:#eaf6f4;--cr-mut:rgba(232,244,243,.68);--cr-line:rgba(255,255,255,.22);--cr-chip:rgba(255,255,255,.07);--cr-on:#2dd4bf;--cr-onink:#05161B;--cr-ring:#05161B;--a:.16;color-scheme:dark}
body{background:var(--bg);color:var(--cr-ink);font-family:Inter,system-ui,sans-serif;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:900px;margin:0 auto}
.hd{margin:0 0 18px}.hd small{font:700 11px Inter;letter-spacing:.12em;text-transform:uppercase;color:var(--cr-mut)}
.hd h1{margin:4px 0 4px;font:700 clamp(24px,5vw,34px)/1.15 Inter;letter-spacing:-.02em;text-wrap:balance}
.hd p{margin:0;color:var(--cr-mut);font-size:14px}
.ft{margin-top:26px;display:flex;align-items:center;gap:12px;color:var(--cr-mut);font-size:13px}
.ft img{width:56px;height:56px;border-radius:50%;object-fit:cover}
.cr-tag{filter:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cr-tag{filter:brightness(1.25)}}
:root[data-theme="dark"] .cr-tag{filter:brightness(1.25)}
.cr{--cr-ink:#0f2a2d;--cr-mut:#4a6a6d;--cr-line:rgba(15,42,45,.14);--cr-chip:rgba(15,42,45,.06);--cr-on:#0f2a2d;--cr-onink:#fff;--a:.14;font-family:Inter,system-ui,sans-serif;color:var(--cr-ink)}
.cr *{box-sizing:border-box}
.cr-top{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between}
.cr-tabs,.cr-filters{display:flex;flex-wrap:wrap;gap:8px}
.cr button{font:inherit;color:inherit;cursor:pointer}
.cr-tab{padding:10px 18px;border-radius:999px;border:1.5px solid var(--cr-line);background:transparent;font-weight:700;font-size:14px}
.cr-tab[aria-selected="true"]{background:var(--cr-on);color:var(--cr-onink);border-color:var(--cr-on)}
.cr-chip{padding:6px 12px;border-radius:999px;border:1px solid var(--cr-line);background:var(--cr-chip);font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.cr-chip i{width:9px;height:9px;border-radius:50%;background:rgb(var(--c,120,150,150));display:inline-block}
.cr-chip[aria-pressed="true"]{background:var(--cr-on);color:var(--cr-onink);border-color:var(--cr-on)}
.cr-head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:flex-end;justify-content:space-between;margin:18px 0 12px}
.cr-head h3{margin:0;font:700 clamp(20px,3.4vw,27px)/1.2 Inter,sans-serif;letter-spacing:-.01em;text-wrap:balance;color:var(--cr-ink)}
.cr-head small{display:block;font:600 11.5px Inter;letter-spacing:.08em;text-transform:uppercase;color:var(--cr-mut);margin-bottom:4px}
.cr-copy{padding:8px 14px;border-radius:10px;border:1.5px solid var(--cr-line);background:transparent;font-weight:600;font-size:13px}
.cr-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.cr-row{--c:18,165,148;display:grid;grid-template-columns:78px minmax(0,1fr);gap:12px;align-items:start;background:rgba(var(--c),var(--a));border-radius:14px;padding:12px 14px 12px 12px;border:1px solid rgba(var(--c),.28)}
.cr-row[data-t="apertura"]{--c:232,184,0}.cr-row[data-t="taller"]{--c:124,92,224}.cr-row[data-t="pausa"]{--c:224,72,143}
.cr-row.now{box-shadow:0 0 0 2px rgb(var(--c))}
.cr-h{font:700 13px/1.3 Inter;font-variant-numeric:tabular-nums;color:var(--cr-ink);padding-top:2px}
.cr-h span{display:block;font-weight:500;color:var(--cr-mut)}
.cr-b{min-width:0}
.cr-tag{font:800 10px Inter;letter-spacing:.1em;text-transform:uppercase;color:rgb(var(--c));filter:brightness(.82)}
.cr-pend{font:700 10px Inter;background:rgba(232,184,0,.22);color:var(--cr-ink);padding:2px 8px;border-radius:99px;margin-left:6px}
.cr-now{font:800 10px Inter;letter-spacing:.08em;text-transform:uppercase;background:rgb(var(--c));color:#fff;padding:2px 8px;border-radius:99px;margin-left:6px}
.cr-t{margin:2px 0 0;font:700 15.5px/1.3 Inter;color:var(--cr-ink);text-wrap:pretty}
.cr-ws{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:8px}
.cr-w{display:flex;align-items:center;gap:9px;min-width:0}
.cr-w img,.cr-ini{width:36px;height:36px;border-radius:50%;object-fit:cover;flex:none;box-shadow:0 0 0 2px rgb(var(--c)),0 0 0 4px var(--cr-ring,#fff)}
.cr-ini{display:grid;place-items:center;background:rgb(var(--c));color:#fff;font:700 11px Inter}
.cr-wn{min-width:0;line-height:1.25}.cr-wn b{display:block;font:700 13px Inter;color:var(--cr-ink)}.cr-wn span{display:block;font:400 11.5px Inter;color:var(--cr-mut)}
.cr-row.many .cr-wn span{display:none}
.cr-more{margin-top:8px;display:none;font:400 13.5px/1.5 Inter;color:var(--cr-ink)}
.cr-row.open .cr-more{display:block}.cr-more em{display:block;margin-top:6px;font-style:normal;font-size:12px;color:var(--cr-mut)}
.cr-tog{margin-top:8px;border:0;background:none;padding:0;font:600 12.5px Inter;color:var(--cr-ink);text-decoration:underline;text-underline-offset:3px}
.cr-row.pa{align-items:center;padding:8px 14px 8px 12px}.cr-row.pa .cr-t{font-size:14px;margin:0}
.cr-empty{padding:18px;border:1px dashed var(--cr-line);border-radius:12px;color:var(--cr-mut);font-size:14px}
.cr-toast{font:600 12.5px Inter;color:var(--cr-mut);min-height:18px;margin-top:8px}
.cr button:focus-visible{outline:2px solid rgb(18,165,148);outline-offset:2px}
@media (max-width:520px){.cr-row{grid-template-columns:62px minmax(0,1fr);gap:8px}.cr-h{font-size:12px}}
